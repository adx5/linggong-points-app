name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend files
        run: |
          if [ ! -f "frontend/index.html" ]; then
            echo "::error::❌ 错误：在 frontend/ 目录下找不到 index.html！"
            echo "请确认你的首页文件已放入 frontend/ 文件夹，并命名为 index.html"
            exit 1
          fi
          echo "✅ 找到 frontend/index.html，准备部署..."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
