version: "3.9"

# Linggong points app - frontend/backend separated deployment
# usage: cd into this dir, then run:  docker compose up -d --build
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: linggong-backend:latest
    container_name: linggong-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped
    # run alembic migration on boot so schema always catches up with models
    # (fixes the "column jobs.publisher_id does not exist" 500 error)
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: linggong-frontend:latest
    container_name: linggong-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
