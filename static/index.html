<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零工获取积分App - 纯净版</title>
  <style>
    :root {
      --primary: #409eff; --success: #67c23a; --warning: #e6a23c; --danger: #f56c6c;
      --text-main: #303133; --text-sub: #909399; --bg: #f5f7fa; --border: #ebeef5;
    }
    body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text-main); }
    .app-header { background: linear-gradient(135deg, #409eff 0%, #36d1dc 100%); color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .card h3 { margin: 0 0 15px 0; font-size: 16px; border-left: 4px solid var(--primary); padding-left: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-sub); }
    input, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s; }
    input:focus, select:focus { border-color: var(--primary); }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #a0cfff; cursor: not-allowed; }
    button.danger { background: var(--danger); }
    button.success { background: var(--success); }
    button.outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    button.small { width: auto; padding: 4px 10px; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .task-item { border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; background: #fafbfc; transition: all 0.2s; }
    .task-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(64,158,255,0.15); }
    .task-item .points { color: var(--danger); font-size: 20px; font-weight: bold; margin-top: 5px; }
    .task-item.disabled { opacity: 0.5; pointer-events: none; }
    .log-box { background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 12px; padding: 15px; border-radius: 8px; height: 150px; overflow-y: auto; white-space: pre-wrap; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 18px; font-weight: bold; }
    .hidden { display: none !important; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .stat-box { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .stat-box .label { font-size: 12px; color: var(--text-sub); }
    .stat-box .val { font-size: 24px; font-weight: bold; color: var(--primary); margin-top: 5px; }
    .progress-bar { height: 8px; background: var(--border); border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .progress-inner { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #fafafa; font-weight: 600; }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div id="login-page" class="container" style="margin-top: 60px;">
    <div class="card">
      <h3 style="text-align: center; border: none; padding: 0;">🔐 登录 / 注册</h3>
      <p style="text-align: center; color: var(--text-sub); font-size: 12px;">测试模式 - 验证码固定 123456</p>
      <div class="form-group">
        <select id="login-role">
          <option value="user">C端用户</option>
          <option value="store">B端门店</option>
          <option value="admin">A端总部</option>
        </select>
      </div>
      <div class="form-group" id="group-phone">
        <input type="text" id="login-phone" value="13800000001" placeholder="手机号">
      </div>
      <div class="form-group hidden" id="group-store">
        <input type="text" id="login-store" value="store001" placeholder="门店码">
      </div>
      <div class="form-group" id="group-code">
        <input type="text" id="login-code" value="123456" placeholder="验证码">
      </div>
      <button onclick="doLogin()" id="btn-login">立即登录</button>
    </div>
  </div>

  <!-- C端页面 -->
  <div id="user-page" class="hidden">
    <div class="app-header">
      <div class="header-title">零工获取积分App</div>
      <button class="outline" style="width: auto; padding: 6px 12px;" onclick="logout()">退出</button>
    </div>
    <div class="container">
      <div class="stat-grid">
        <div class="stat-box">
          <div class="label">💰 可用积分</div>
          <div class="val" id="user-points" style="color: var(--success);">0</div>
        </div>
        <div class="stat-box">
          <div class="label">🌱 成长值 (等级)</div>
          <div class="val" id="user-growth">0</div>
        </div>
      </div>

      <div class="card">
        <h3>🎯 每日任务 (点击获取)</h3>
        <div class="grid" id="task-list"></div>
      </div>

      <div class="card">
        <h3>📺 看视频赚积分 (按组结算)</h3>
        <p style="color:var(--text-sub); font-size:12px; margin-top:-10px; margin-bottom:15px;">每组10个视频全部看完获得5分，每天3组共15分</p>
        <div id="ad-list"></div>
      </div>
    </div>
  </div>

  <!-- B端页面 -->
  <div id="store-page" class="hidden">
    <div class="app-header">
      <div class="header-title">🏪 门店核销台</div>
      <button class="outline" style="width: auto; padding: 6px 12px;" onclick="logout()">退出</button>
    </div>
    <div class="container">
      <div class="card">
        <h3>📱 用户核销</h3>
        <div class="form-group">
          <input type="text" id="verify-phone" value="13800000001" placeholder="会员手机号">
        </div>
        <div class="flex-between" style="gap: 10px; margin-bottom: 15px;">
          <input type="number" id="verify-points" value="10" placeholder="扣减积分">
          <button class="outline" onclick="queryUser()" style="width: 120px;">查询用户</button>
        </div>
        <div id="query-result" style="margin-bottom: 15px; font-size: 14px; color: var(--text-sub);"></div>
        <button class="danger" onclick="doVerify()">⚡ 确认核销</button>
      </div>
    </div>
  </div>

  <!-- A端总部页面 (新增) -->
  <div id="admin-page" class="hidden">
    <div class="app-header">
      <div class="header-title">🏢 总部测试后台</div>
      <button class="outline" style="width: auto; padding: 6px 12px;" onclick="logout()">退出</button>
    </div>
    <div class="container">
      <div class="card">
        <div class="flex-between">
          <h3 style="border:none; padding:0; margin:0;">📊 数据看板</h3>
          <button class="outline small" onclick="loadAdminDashboard()">刷新</button>
        </div>
        <div class="grid" id="admin-dashboard" style="margin-top:15px;"></div>
      </div>

      <div class="card">
        <div class="flex-between">
          <h3 style="border:none; padding:0; margin:0;">👥 用户列表 & 管理</h3>
          <button class="outline small" onclick="loadAdminUsers()">刷新</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>手机号</th>
                <th>积分</th>
                <th>成长值</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="admin-user-list"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3 style="color: var(--danger); border-left-color: var(--danger);">⚠️ 危险操作区</h3>
        <p style="font-size:12px; color:var(--text-sub);">清空所有流水/分桶/核销/广告/任务/兑换记录，保留3个测试用户。</p>
        <button class="danger" onclick="doReset()">一键重置所有测试数据</button>
      </div>
    </div>
  </div>

  <!-- 日志区域 -->
  <div class="container">
    <div class="card">
      <div class="flex-between">
        <h3 style="border: none; padding: 0; margin: 0;">📋 运行日志</h3>
        <button class="outline small" onclick="document.getElementById('log').innerHTML=''">清空</button>
      </div>
      <div class="log-box" id="log">等待操作...</div>
    </div>
  </div>

  <script>
    const state = { token: '', role: '' };

    document.getElementById('login-role').addEventListener('change', (e) => {
      const role = e.target.value;
      document.getElementById('group-phone').classList.toggle('hidden', role !== 'user');
      document.getElementById('group-store').classList.toggle('hidden', role !== 'store');
      document.getElementById('group-code').classList.toggle('hidden', role === 'admin');
      if(role === 'admin') {
        document.getElementById('login-phone').value = 'admin';
      } else {
        document.getElementById('login-phone').value = '13800000001';
      }
    });

    function log(msg, isError = false) {
      const box = document.getElementById('log');
      const color = isError ? 'var(--danger)' : '#00ff00';
      const time = new Date().toLocaleTimeString();
      box.innerHTML = `<div style="color:${color}">[${time}] ${msg}</div>` + box.innerHTML;
    }

    async function api(path, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
      try {
        const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
        const data = await res.json();
        if (data.code !== 0) throw new Error(data.message || '请求失败');
        return data.data;
      } catch (err) {
        log(`请求失败: ${err.message}`, true);
        throw err;
      }
    }

    async function doLogin() {
      const role = document.getElementById('login-role').value;
      const body = { role, code: document.getElementById('login-code').value };
      if (role === 'user') body.phone = document.getElementById('login-phone').value;
      if (role === 'store') body.storeCode = document.getElementById('login-store').value;
      if (role === 'admin') { body.phone = 'admin'; body.code = '123456'; }

      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.innerText = '登录中...';

      try {
        const data = await api('/api/auth/login', 'POST', body);
        state.token = data.token;
        state.role = data.role;
        log('登录成功');

        document.getElementById('login-page').classList.add('hidden');
        if (data.role === 'user') {
          document.getElementById('user-page').classList.remove('hidden');
          loadUserStats(); loadTasks(); loadAds();
        } else if (data.role === 'store') {
          document.getElementById('store-page').classList.remove('hidden');
        } else if (data.role === 'admin') {
          document.getElementById('admin-page').classList.remove('hidden');
          loadAdminDashboard(); loadAdminUsers();
        }
      } catch (e) {
      } finally {
        btn.disabled = false; btn.innerText = '立即登录';
      }
    }

    function logout() {
      state.token = ''; state.role = '';
      document.getElementById('user-page').classList.add('hidden');
      document.getElementById('store-page').classList.add('hidden');
      document.getElementById('admin-page').classList.add('hidden');
      document.getElementById('login-page').classList.remove('hidden');
    }

    // --- C端逻辑 ---
    async function loadUserStats() {
      try {
        const data = await api('/api/user/points');
        document.getElementById('user-points').innerText = data.available_points;
        document.getElementById('user-growth').innerText = data.growth_value;
      } catch (e) {}
    }

    async function loadTasks() {
      try {
        const data = await api('/api/tasks/today');
        const map = { signin:'签到', moments:'朋友圈', appDownload:'App下载', yifenGou:'1分购', study:'线上学习', studyOffline:'线下学习', parttime:'兼职' };
        const pts = { signin:1, moments:3, appDownload:25, yifenGou:3, study:5, studyOffline:20, parttime:3 };

        let html = '';
        for (const k in data) {
          if(k === '_raw') continue;
          const isDone = data[k] > 0;
          html += `
            <div class="task-item ${isDone ? 'disabled' : ''}" onclick="doTask('${k}')">
              <div style="font-weight:bold;">${map[k] || k} ${isDone?'(已完)':''}</div>
              <div class="points">+${pts[k] || 0}</div>
            </div>`;
        }
        document.getElementById('task-list').innerHTML = html;
      } catch (e) {}
    }

    async function doTask(code) {
      try {
        await api('/api/tasks/' + code, 'POST');
        log(`完成任务: ${code}`);
        loadUserStats(); loadTasks();
      } catch (e) {}
    }

    async function loadAds() {
      try {
        const data = await api('/api/ads/status');
        let html = '';
        data.groups.forEach(g => {
          const percent = (g.current / 10) * 100;
          const color = g.settled ? 'var(--text-sub)' : 'var(--primary)';
          html += `
            <div style="border:1px solid var(--border); padding:15px; border-radius:8px; margin-bottom:10px;">
              <div class="flex-between" style="margin-bottom:8px;">
                <b style="color:${color}">第 ${g.id} 组</b>
                <span style="font-size:12px; color:var(--text-sub)">${g.current} / 10 ${g.settled ? '(已结算 +5分)' : ''}</span>
              </div>
              <div class="progress-bar">
                <div class="progress-inner" style="width: ${percent}%; background: ${g.settled ? 'var(--text-sub)' : 'var(--success)'}"></div>
              </div>
              <button style="margin-top:10px;" class="${g.settled ? 'outline' : ''}" ${g.settled ? 'disabled' : ''} onclick="watchAd(${g.id})">
                ${g.settled ? '已结算' : '模拟看完1个视频'}
              </button>
            </div>`;
        });
        document.getElementById('ad-list').innerHTML = html;
      } catch (e) {}
    }

    async function watchAd(groupId) {
      try {
        const transId = 'WEB-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
        const res = await api('/api/ads/pre-reward', 'POST', { adGroupId: groupId, transId });
        if (res.credited) {
          log(`🎉 第${groupId}组完成，结算 +5 积分！`);
          loadUserStats();
        } else {
          log(`视频观看记录已提交 (${res.current}/10)`);
        }
        loadAds();
      } catch (e) {}
    }

    // --- B端逻辑 ---
    async function queryUser() {
      const phone = document.getElementById('verify-phone').value;
      try {
        const data = await api('/api/verify/query', 'POST', { phone });
        document.getElementById('query-result').innerHTML = `
          <div style="color:var(--primary); font-weight:bold; margin-bottom:5px;">✅ 查询成功</div>
          <div>用户: ${data.nickname} (${data.phone})</div>
          <div>可用积分: <span style="color:var(--danger); font-weight:bold;">${data.available_points}</span></div>
        `;
        log(`查询用户成功，当前积分 ${data.available_points}`);
      } catch (e) {
        document.getElementById('query-result').innerHTML = '<span style="color:var(--danger)">❌ 未找到该用户</span>';
      }
    }

    async function doVerify() {
      const phone = document.getElementById('verify-phone').value;
      const points = parseInt(document.getElementById('verify-points').value);
      if (!points) return alert('请输入核销积分');

      try {
        const data = await api('/api/verify/confirm', 'POST', { phone, totalPoints: points, verifyCode: '123' });
        log(`核销成功！扣除了 ${points} 分，剩余 ${data.remaining_points} 分`);
        document.getElementById('query-result').innerHTML = '<span style="color:var(--success); font-weight:bold;">✅ 核销成功！</span>';
      } catch (e) {}
    }

    // --- A端逻辑 ---
    async function loadAdminDashboard() {
      try {
        const data = await api('/api/admin/dashboard');
        document.getElementById('admin-dashboard').innerHTML = `
          <div class="stat-box"><div class="label">用户总数</div><div class="val">${data.total_users || 0}</div></div>
          <div class="stat-box"><div class="label">总发放积分</div><div class="val" style="color:var(--success)">${data.total_points || 0}</div></div>
          <div class="stat-box"><div class="label">今日发放任务</div><div class="val">${data.total_task_today || 0}</div></div>
          <div class="stat-box"><div class="label">今日核销积分</div><div class="val" style="color:var(--danger)">${data.total_verify_today_points || 0}</div></div>
        `;
      } catch (e) {}
    }

    async function loadAdminUsers() {
      try {
        const data = await api('/api/admin/users');
        let html = '';
        data.forEach(u => {
          html += `
            <tr>
              <td>${u.id}</td>
              <td>${u.phone}</td>
              <td style="color:var(--success); font-weight:bold;">${u.available_points}</td>
              <td>${u.growth_value}</td>
              <td>
                <button class="outline small" onclick="addPoints(${u.id})">+100分</button>
              </td>
            </tr>
          `;
        });
        document.getElementById('admin-user-list').innerHTML = html;
      } catch (e) {}
    }

    async function addPoints(uid) {
      try {
        await api('/api/admin/add-points', 'POST', { userId: uid, points: 100, remark: '后台手动加100' });
        log(`已为 ID ${uid} 的用户加 100 分`);
        loadAdminDashboard(); loadAdminUsers();
      } catch (e) {}
    }

    async function doReset() {
      if (!confirm('确定要清空所有测试数据吗？此操作不可恢复！')) return;
      try {
        const res = await api('/api/admin/reset', 'POST');
        log(res.message || '重置成功');
        loadAdminDashboard(); loadAdminUsers();
      } catch (e) {}
    }
  </script>
</body>
</html>
